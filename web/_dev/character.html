<!doctype html><meta charset="utf-8"><title>character</title>
<style>body{margin:0;background:#9aa6b2}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three';
import { makeHuman, poseWalk, poseIdle } from '../src/character.ts';
const W = 1600, H = 900;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(r.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x6b5d4a, 1.4));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2); sun.position.set(3, 6, 4); scene.add(sun);
r.setClearColor(0x9aa6b2); r.setScissorTest(true);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const views = [
  ['idle front', (f) => { f.rotation.y = 0.0; poseIdle(f, 0.5); }, [0, 1.25, 2.6], [0, 1.15, 0]],
  ['idle 3/4 back', (f) => { f.rotation.y = Math.PI - 0.7; poseIdle(f, 0.5); }, [0, 1.35, 2.6], [0, 1.15, 0]],
  ['run side', (f) => { f.rotation.y = Math.PI / 2; poseWalk(f, 0.6 * Math.PI * 2, 4.4); }, [0, 1.2, 2.6], [0, 1.1, 0]],
  ['sprint 3/4', (f) => { f.rotation.y = 0.7; poseWalk(f, 0.3 * Math.PI * 2, 9); }, [0, 1.2, 2.6], [0, 1.1, 0]],
  ['chase', (f) => { f.rotation.y = Math.PI; poseWalk(f, 0.15 * Math.PI * 2, 4.4); }, [0, 2.0, 3.4], [0, 1.1, 0]],
  ['arms up', (f) => { f.rotation.y = 0.3; poseWalk(f, 0.8 * Math.PI * 2, 9); }, [0, 1.3, 2.4], [0, 1.2, 0]],
];
views.forEach(([, pose, pos, look], i) => {
  const f = makeHuman(); f.position.set(i * 10, 0, 0); pose(f); scene.add(f);
  const w = W / 3, h = H / 2, x = (i % 3) * w, y = i < 3 ? h : 0;
  cam.aspect = w / h; cam.updateProjectionMatrix();
  cam.position.set(i * 10 + pos[0], pos[1], pos[2]); cam.lookAt(i * 10 + look[0], look[1], look[2]);
  r.setViewport(x, y, w, h); r.setScissor(x, y, w, h); r.render(scene, cam);
});
window.done = true;
</script>
